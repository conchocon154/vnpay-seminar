  <div class="card">

<p><strong>VNPAY giải quyết bằng cách đảo ngược luồng:</strong> user nhập thẻ <em>trên trang của VNPAY</em>,

S.push(`
<span class="eyebrow">02 · Kiến trúc</span>
<h2>Bốn đường đi, và chỉ hai đường được tin</h2>

<div class="flow">
  <div class="step">

  </div>
  <div class="step key">
    <span class="n">2</span><span class="lane">VNPAY → BE</span>
    <div><strong>IPN — server-to-server.</strong> VNPAY gọi thẳng vào server bạn.

S.push(`
<span class="eyebrow">03 · Hands-on</span>
<h2>Chữ ký: ba bước, sai một bước là fail</h2>
<p class="lede">Đây là toàn bộ phần khó của VNPAY. Nắm ba dòng này thì mọi luồng còn lại chỉ là gọi hàm.</p>

<pre><span class="c">// 1. sort alphabet · 2. URL-encode GIÁ TRỊ · 3. HMAC-SHA512 → hex thường</span>
<span class="k">String</span> query = params.entrySet().stream()
        .sorted(Map.Entry.comparingByKey())
        .filter(e -&gt; !e.getValue().isEmpty())          <span class="c">// bỏ tham số rỗng</span>
        .map(e -&gt; e.getKey() + <span class="s">"="</span> + URLEncoder.encode(e.getValue(), US_ASCII))
        .collect(joining(<span class="s">"&amp;"</span>));

<span class="k">String</span> secureHash = <span class="hl">hmacSHA512</span>(hashSecret, query);
<span class="k">String</span> paymentUrl = PAY_URL + <span class="s">"?"</span> + query + <span class="s">"&amp;vnp_SecureHash="</span> + secureHash;</pre>

<p>Verify callback dùng <em>đúng</em> công thức đó, sau khi bỏ <code>vnp_SecureHash</code> và

  <p class="t">Hai lỗi chiếm 90% ca "sai chữ ký"</p>

  </ul>
</div>

<pre>p.put(<span class="s">"vnp_Amount"</span>, String.valueOf(amount * <span class="hl">100</span>));

<span class="eyebrow">03 · Hands-on</span>
<h2>Nhận IPN: năm nhánh, trả đúng mã</h2>
<p class="lede">VNPAY <strong>retry cho tới khi nhận được <code>RspCode = 00</code></strong>.
Nên handler bắt buộc phải idempotent.</p>

<pre><span class="c">// 97 — chữ ký sai</span>
<span class="k">if</span> (!VnpayUtils.isValidSignature(params, secret))   <span class="k">return</span> rsp(<span class="s">"97"</span>, <span class="s">"Invalid Checksum"</span>);

<span class="c">// 01 — không có đơn</span>
Order order = store.findByTxnRef(txnRef).orElse(<span class="k">null</span>);
<span class="k">if</span> (order == <span class="k">null</span>)                                 <span class="k">return</span> rsp(<span class="s">"01"</span>, <span class="s">"Order not Found"</span>);

<span class="c">// 04 — chống sửa số tiền trên URL</span>
<span class="k">if</span> (vnpAmount != order.getAmount() * 100)          <span class="k">return</span> rsp(<span class="s">"04"</span>, <span class="s">"Invalid Amount"</span>);

<span class="k">synchronized</span> (order) {
    <span class="c">// 02 — đã xử lý rồi, KHÔNG cộng tiền lần hai</span>
    <span class="k">if</span> (order.getStatus() != PENDING)              <span class="k">return</span> rsp(<span class="s">"02"</span>, <span class="s">"Order already confirmed"</span>);

    <span class="k">boolean</span> paid = <span class="s">"00"</span>.equals(responseCode) &amp;&amp; <span class="s">"00"</span>.equals(transactionStatus);
    order.setStatus(paid ? PAID : FAILED);
}
<span class="k">return</span> rsp(<span class="s">"00"</span>, <span class="s">"Confirm Success"</span>);   <span class="c">// VNPAY ngừng retry</span></pre>

<p>Thành công ⟺ <code>vnp_ResponseCode == "00"</code> <strong>và</strong>
<code>vnp_TransactionStatus == "00"</code>. Hay gặp: <code>24</code> user huỷ ·
<code>51</code> không đủ số dư · <code>11</code> hết hạn thanh toán.</p>
`);

/* ---------- deck engine ---------- */
const stage = document.getElementById('stage');
const prevB = document.getElementById('prev');
const nextB = document.getElementById('next');
const countEl = document.getElementById('count');
const progEl = document.getElementById('prog');
let i = 0;

function render(){
  stage.innerHTML = '<section class="slide">' + S[i] + '</section>';
  countEl.textContent = (i + 1) + ' / ' + S.length;
  progEl.style.width = ((i + 1) / S.length * 100) + '%';
  prevB.disabled = i === 0;
  nextB.disabled = i === S.length - 1;
  window.scrollTo(0, 0);
  try { location.hash = 's' + (i + 1); } catch (e) {}
}
function go(n){ const t = Math.min(Math.max(n, 0), S.length - 1); if (t !== i) { i = t; render(); } }

prevB.addEventListener('click', () => go(i - 1));
nextB.addEventListener('click', () => go(i + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(i - 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(S.length - 1); }
});
let tx = null;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) go(dx < 0 ? i + 1 : i - 1);
  tx = null;
}, {passive:true});

const m = /^#s(\d+)$/.exec(location.hash || '');
if (m) i = Math.min(Math.max(parseInt(m[1], 10) - 1, 0), S.length - 1);
render();
</script>
