<title>Dựng cổng thanh toán VNPAY</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EFF1F4; --surface:#FFFFFF; --surface-2:#F5F7FA;
  --ink:#101722; --ink-2:#3C4757; --muted:#6B7788;
  --line:#D8DEE6; --line-2:#E8ECF1;
  --accent:#0A5BA8; --accent-soft:#E3EDF7;
  --hot:#C42B22; --hot-soft:#FBE9E7;
  --ok:#0B6B47; --ok-soft:#E0F2EA;
  --code-bg:#111A27; --code-ink:#D7E3F2; --code-dim:#7A8CA3; --code-key:#7FC2FF;
  --tab-bg:#1C2736;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B111A; --surface:#141C28; --surface-2:#1A2432;
    --ink:#E9EEF5; --ink-2:#BCC7D6; --muted:#8998AB;
    --line:#26313F; --line-2:#1F2937;
    --accent:#6FB2F0; --accent-soft:#16283C;
    --hot:#F2897F; --hot-soft:#2E1917;
    --ok:#6BD3A8; --ok-soft:#10261E;
    --code-bg:#070D14; --code-ink:#D7E3F2; --code-dim:#6F8299; --code-key:#7FC2FF;
    --tab-bg:#101A26;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111A; --surface:#141C28; --surface-2:#1A2432;
  --ink:#E9EEF5; --ink-2:#BCC7D6; --muted:#8998AB;
  --line:#26313F; --line-2:#1F2937;
  --accent:#6FB2F0; --accent-soft:#16283C;
  --hot:#F2897F; --hot-soft:#2E1917;
  --ok:#6BD3A8; --ok-soft:#10261E;
  --code-bg:#070D14; --code-ink:#D7E3F2; --code-dim:#6F8299; --code-key:#7FC2FF;
  --tab-bg:#101A26;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
code,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

.deck{min-height:100%;display:flex;flex-direction:column;padding:0 16px 84px}
.slide{max-width:1020px;width:100%;margin:0 auto;padding-block:clamp(20px,3.6vh,40px);animation:in .26s ease-out}
@keyframes in{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

.step-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stepno{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.08em;
  color:#fff;background:var(--accent);padding:4px 10px;border-radius:6px;text-transform:uppercase}
.stepno.check{background:var(--ok)}
.stepno.warn{background:var(--hot)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
  padding:5px 11px;border-radius:999px;margin-bottom:14px}
h1{font-size:clamp(28px,5vw,48px);line-height:1.08;margin:0 0 14px;letter-spacing:-.022em;text-wrap:balance}
h2{font-size:clamp(21px,3.2vw,32px);line-height:1.18;margin:0 0 10px;letter-spacing:-.018em;text-wrap:balance}
h3{font-size:15.5px;margin:0 0 8px}
.lede{font-size:clamp(14.5px,1.8vw,17px);color:var(--ink-2);max-width:64ch;margin:0 0 20px}
p{margin:0 0 11px}

.file{display:flex;align-items:center;gap:9px;background:var(--tab-bg);color:#93A9C4;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:8px 14px;
  border-radius:10px 10px 0 0;border-bottom:1px solid rgba(255,255,255,.07)}
.file .dot{width:9px;height:9px;border-radius:50%;background:#3D4C60;flex:none}
.file .new{margin-left:auto;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#7FC2FF;background:rgba(127,194,255,.12);padding:2px 7px;border-radius:4px}
pre{background:var(--code-bg);color:var(--code-ink);border-radius:0 0 10px 10px;
  padding:15px 17px;overflow-x:auto;margin:0 0 14px;
  font-size:clamp(11.5px,1.45vw,14px);line-height:1.6}
pre.solo{border-radius:10px}
pre .c{color:var(--code-dim)}
pre .k{color:var(--code-key)}
pre .s{color:#9BE3B4}
pre .hl{color:#FFD479;font-weight:500}
code:not(pre code){background:var(--surface-2);border:1px solid var(--line-2);
  padding:1px 6px;border-radius:5px;font-size:.89em}

figure{margin:0 0 14px}
figure img{width:100%;display:block;border:1px solid var(--line);border-radius:10px}
figcaption{font-size:12.5px;color:var(--muted);margin-top:7px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(265px,1fr))}

.callout{border-left:3px solid var(--hot);background:var(--hot-soft);padding:13px 17px;
  border-radius:0 10px 10px 0;margin-bottom:14px}
.callout.good{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.info{border-left-color:var(--accent);background:var(--accent-soft)}
.callout p:last-child,.callout ul:last-child,.callout ol:last-child{margin-bottom:0}
.callout .t{font-weight:600;margin-bottom:4px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
td.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

ul,ol{margin:0 0 11px;padding-left:20px}
li{margin-bottom:6px}
li::marker{color:var(--muted)}
hr.rule{height:1px;background:var(--line);border:0;margin:20px 0}

.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.steps div{display:flex;gap:13px;align-items:baseline;padding:9px 16px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.steps div:last-child{border-bottom:0}
.steps .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-weight:600;flex:none;width:26px}
.steps .g{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.steps div.sec{background:var(--surface-2);font-weight:600;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;z-index:20}
.bar .prog{flex:1;height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar .prog i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.bar button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;min-width:44px}
.bar button:hover{border-color:var(--accent);color:var(--accent)}
.bar button:disabled{opacity:.38;cursor:default;border-color:var(--line)}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:640px){.hint{display:none}}
</style>

<div class="deck"><main id="stage"></main></div>

<nav class="bar">

  <span class="count" id="count"></span>
  <div class="prog"><i id="prog"></i></div>
  <span class="hint">← → để chuyển slide</span>
</nav>

S.push(`
<div class="step-head"><span class="stepno">Bước 05</span><h2>Trái tim của bài: hàm ký</h2></div>
<p class="lede">Nắm 3 bước này là nắm 90% VNPAY: <strong>sort alphabet → URL-encode giá trị → HMAC-SHA512</strong>.</p>

<div class="file"><span class="dot"></span>util/VnpayUtils.java<span class="new">mới</span></div>
<pre><span class="k">public static</span> String <span class="hl">hmacSHA512</span>(String secretKey, String data) {
    <span class="k">try</span> {
        Mac mac = Mac.getInstance(<span class="s">"HmacSHA512"</span>);
        mac.init(<span class="k">new</span> SecretKeySpec(secretKey.getBytes(UTF_8), <span class="s">"HmacSHA512"</span>));
        <span class="k">byte</span>[] bytes = mac.doFinal(data.getBytes(UTF_8));

        StringBuilder hex = <span class="k">new</span> StringBuilder(bytes.length * 2);
        <span class="k">for</span> (<span class="k">byte</span> b : bytes) hex.append(String.format(<span class="s">"%02x"</span>, b));
        <span class="k">return</span> hex.toString();            <span class="c">// hex CHỮ THƯỜNG</span>
    } <span class="k">catch</span> (Exception e) {
        <span class="k">throw new</span> IllegalStateException(<span class="s">"Không tạo được HMAC-SHA512"</span>, e);
    }
}

<span class="k">public static</span> String <span class="hl">buildQueryString</span>(Map&lt;String, String&gt; params) {
    StringBuilder sb = <span class="k">new</span> StringBuilder();
    <span class="k">for</span> (var e : <span class="hl">new TreeMap&lt;&gt;(params)</span>.entrySet()) {     <span class="c">// 1. sort alphabet</span>
        <span class="k">if</span> (e.getValue() == <span class="k">null</span> || e.getValue().isEmpty()) <span class="k">continue</span>;
        <span class="k">if</span> (!sb.isEmpty()) sb.append(<span class="s">'&amp;'</span>);
        sb.append(URLEncoder.encode(e.getKey(), US_ASCII)).append(<span class="s">'='</span>)
          .append(<span class="hl">URLEncoder.encode(e.getValue(), US_ASCII)</span>);   <span class="c">// 2. encode giá trị</span>
    }
    <span class="k">return</span> sb.toString();
}</pre>

<p>Chuỗi trả về vừa là <code>hashData</code> để băm, vừa là query string gắn vào URL — dùng chung một hàm
nên không bao giờ lệch nhau.</p>
`);

S.push(`
<div class="step-head"><span class="stepno">Bước 06</span><h2>Verify chữ ký khi VNPAY gọi về</h2></div>
<p class="lede">Dùng lại đúng hàm ở bước 5, chỉ thêm một việc: <strong>bỏ chính chữ ký ra khỏi chuỗi</strong>
trước khi băm.</p>

<div class="file"><span class="dot"></span>util/VnpayUtils.java<span class="new">thêm</span></div>
<pre><span class="k">public static boolean</span> isValidSignature(Map&lt;String, String&gt; params, String secretKey) {
    String received = params.get(<span class="s">"vnp_SecureHash"</span>);
    <span class="k">if</span> (received == <span class="k">null</span> || received.isBlank()) <span class="k">return false</span>;

    Map&lt;String, String&gt; clone = <span class="k">new</span> TreeMap&lt;&gt;(params);
    <span class="hl">clone.remove("vnp_SecureHash");</span>          <span class="c">// không tự băm chính mình</span>
    <span class="hl">clone.remove("vnp_SecureHashType");</span>

    String expected = hmacSHA512(secretKey, buildQueryString(clone));
    <span class="k">return</span> <span class="hl">constantTimeEquals</span>(expected, received);   <span class="c">// chống timing attack</span>
}</pre>

<div class="callout">
  <p class="t">Hai lỗi chiếm 90% ca "sai chữ ký"</p>
  <ol>
    <li>Quên <strong>URL-encode lại</strong> khi verify. Servlet đã decode sẵn tham số, không encode lại thì
    chuỗi khác chuỗi VNPAY đã băm.</li>
    <li>Quên <strong>bỏ <code>vnp_SecureHash</code></strong> khỏi map.</li>
  </ol>
  <p>Cách debug: in <code>hashData</code> ra rồi so từng ký tự với query string thật.</p>
</div>
`);

<pre><span class="k">const</span> txnRef = <span class="k">new</span> URLSearchParams(location.search).get(<span class="s">'txnRef'</span>);

<span class="c">// Poll tối đa ~20s: xác nhận là cuộc gọi server-to-server, có thể về sau ReturnURL vài giây</span>
(<span class="k">async function</span> poll(tries = 0) {
  <span class="k">const</span> res = <span class="k">await</span> fetch(<span class="s">'/api/orders/'</span> + encodeURIComponent(txnRef));
  <span class="k">const</span> order = <span class="k">await</span> res.json();

  <span class="k">if</span> (order.status === <span class="s">'<span class="hl">PAID</span>'</span> || order.status === <span class="s">'FAILED'</span>) <span class="k">return</span> render(order);
  <span class="k">if</span> (tries &lt; 10) setTimeout(() =&gt; poll(tries + 1), 2000);
})();</pre>

<div class="callout">
  <p class="t">Vì sao không đọc thẳng <code>vnp_ResponseCode</code> trên URL cho nhanh?</p>
  <p>Vì URL nằm trên trình duyệt của user. Sửa <code>vnp_ResponseCode=00</code> là màn hình báo thành công.
  Nếu bạn cộng tiền theo tham số đó thì user mua hàng miễn phí.</p>
  <p>Tham số trên trình duyệt là <em>dữ liệu user mang về</em>, không phải sự thật.</p>
</div>
`);

<div class="step-head"><span class="stepno">Bước 12</span><h2>ReturnURL — verify rồi mới vẽ</h2></div>

<div class="file"><span class="dot"></span>web/VnpayCallbackController.java<span class="new">mới</span></div>
<pre><span class="k">@GetMapping</span>(<span class="s">"/vnpay/return"</span>)
<span class="k">public</span> ResponseEntity&lt;Void&gt; returnUrl(<span class="k">@RequestParam</span> Map&lt;String, String&gt; params) {

    <span class="k">boolean</span> validSignature = <span class="hl">VnpayUtils.isValidSignature(params, props.getHashSecret())</span>;

    URI target = UriComponentsBuilder.fromPath(<span class="s">"/result.html"</span>)
            .queryParam(<span class="s">"txnRef"</span>,       params.get(<span class="s">"vnp_TxnRef"</span>))
            .queryParam(<span class="s">"responseCode"</span>, params.get(<span class="s">"vnp_ResponseCode"</span>))
            .queryParam(<span class="s">"valid"</span>,        validSignature)
            .build().encode().toUri();

    <span class="k">return</span> ResponseEntity.status(HttpStatus.FOUND).location(target).build();
}</pre>

<div class="callout info">
  <p class="t">Để ý cái KHÔNG có ở đây</p>
  <p>Không có dòng nào đổi trạng thái đơn hàng. Handler này chỉ xác thực chữ ký rồi chuyển trang.
  Cộng tiền là việc của bước 13 và 15.</p>
</div>

S.push(`
<div class="step-head"><span class="stepno">Bước 13</span><h2>IPN — nơi duy nhất được cộng tiền</h2></div>
<p class="lede">VNPAY gọi thẳng server bạn, không qua trình duyệt. Và <strong>retry cho tới khi nhận được
<code>RspCode = 00</code></strong> — nên handler bắt buộc idempotent.</p>

<div class="file"><span class="dot"></span>service/IpnService.java<span class="new">mới</span></div>
<pre><span class="k">public</span> Map&lt;String, String&gt; handle(Map&lt;String, String&gt; params) {

    <span class="k">if</span> (!VnpayUtils.isValidSignature(params, secret))
        <span class="k">return</span> rsp(<span class="hl">"97"</span>, <span class="s">"Invalid Checksum"</span>);

    Order order = store.findByTxnRef(params.get(<span class="s">"vnp_TxnRef"</span>)).orElse(<span class="k">null</span>);
    <span class="k">if</span> (order == <span class="k">null</span>)
        <span class="k">return</span> rsp(<span class="hl">"01"</span>, <span class="s">"Order not Found"</span>);

    <span class="k">if</span> (Long.parseLong(params.get(<span class="s">"vnp_Amount"</span>)) != order.getAmount() * 100)
        <span class="k">return</span> rsp(<span class="hl">"04"</span>, <span class="s">"Invalid Amount"</span>);        <span class="c">// chống sửa tiền trên URL</span>

    <span class="k">synchronized</span> (order) {
        <span class="k">if</span> (order.getStatus() != Status.PENDING)
            <span class="k">return</span> rsp(<span class="hl">"02"</span>, <span class="s">"Order already confirmed"</span>);   <span class="c">// idempotent</span>

        <span class="k">boolean</span> paid = <span class="s">"00"</span>.equals(params.get(<span class="s">"vnp_ResponseCode"</span>))
                   &amp;&amp; <span class="s">"00"</span>.equals(params.get(<span class="s">"vnp_TransactionStatus"</span>));
        order.setStatus(paid ? Status.PAID : Status.FAILED);
        order.setTransactionNo(params.get(<span class="s">"vnp_TransactionNo"</span>));
        store.save(order);
        <span class="c">// → publish event OrderPaid cho các service khác</span>
    }
    <span class="k">return</span> rsp(<span class="hl">"00"</span>, <span class="s">"Confirm Success"</span>);      <span class="c">// VNPAY ngừng retry</span>
}</pre>

<p>Thành công ⟺ <code>vnp_ResponseCode == "00"</code> <strong>và</strong>
<code>vnp_TransactionStatus == "00"</code>. Hay gặp: <code>24</code> user huỷ ·
<code>51</code> không đủ số dư · <code>11</code> hết hạn thanh toán.</p>
`);

<div class="step-head"><span class="stepno warn">Bước 15</span><h2>Khi IPN không bao giờ về</h2></div>

<div class="callout">

  <p>Portal sandbox <strong>không cho khai IPN URL</strong>: mục <em>Danh sách website</em> trống trơn,
  <em>Cài đặt thông báo</em> báo <code>Kết nối hệ thống tạm thời bị gián đoạn</code>.
  Code đúng hết, làm đủ theo tài liệu, mà IPN không bao giờ tới.</p>
</div>

<p>Đường lùi là API <strong><code>querydr</code></strong> — server tự hỏi VNPAY trạng thái thật.
An toàn ngang IPN vì vẫn đủ ba lớp: hỏi thẳng VNPAY → verify chữ ký response → so lại số tiền với DB.</p>

<div class="file"><span class="dot"></span>service/VnpayQueryService.java<span class="new">mới</span></div>
<pre><span class="c">// CHÚ Ý: hash của querydr KHÔNG sort alphabet — nối bằng '|' đúng thứ tự tài liệu</span>
String hashData = String.join(<span class="s">"<span class="hl">|</span>"</span>,
        requestId, version, command, tmnCode,
        txnRef, transactionDate, createDate, ipAddr, orderInfo);

body.put(<span class="s">"vnp_SecureHash"</span>, VnpayUtils.hmacSHA512(props.getHashSecret(), hashData));

Map&lt;String, Object&gt; response = restClient.post().uri(props.getApiUrl())
        .contentType(APPLICATION_JSON).body(body).retrieve().body(Map.class);</pre>

<div class="file"><span class="dot"></span>service/ReconcileService.java<span class="new">mới</span></div>
<pre><span class="k">if</span> (!Boolean.TRUE.equals(r.get(<span class="s">"signatureValid"</span>))) <span class="k">return</span>;   <span class="c">// response cũng có chữ ký</span>
<span class="k">if</span> (!amountMatches(r.get(<span class="s">"vnp_Amount"</span>), order))     <span class="k">return</span>;   <span class="c">// vẫn so tiền</span>

order.setStatus(<span class="s">"00"</span>.equals(r.get(<span class="s">"vnp_TransactionStatus"</span>)) ? PAID : FAILED);</pre>

<p style="font-size:14px;color:var(--muted)">Copy nhầm hàm ký của luồng <code>pay</code> sang đây là fail ngay —
đây là chỗ sai phổ biến nhất sau phần encode.</p>

/* ---------- deck engine ---------- */
const stage=document.getElementById('stage'),prevB=document.getElementById('prev'),
      nextB=document.getElementById('next'),countEl=document.getElementById('count'),
      progEl=document.getElementById('prog');
let i=0;
function render(){
  stage.innerHTML='<section class="slide">'+S[i]+'</section>';
  countEl.textContent=(i+1)+' / '+S.length;
  progEl.style.width=((i+1)/S.length*100)+'%';
  prevB.disabled=i===0; nextB.disabled=i===S.length-1;
  window.scrollTo(0,0);
  try{location.hash='s'+(i+1);}catch(e){}
}
function go(n){const t=Math.min(Math.max(n,0),S.length-1);if(t!==i){i=t;render();}}
prevB.addEventListener('click',()=>go(i-1));
nextB.addEventListener('click',()=>go(i+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home'){e.preventDefault();go(0);}
  else if(e.key==='End'){e.preventDefault();go(S.length-1);}
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60)go(dx<0?i+1:i-1);
  tx=null;
},{passive:true});
const m=/^#s(\d+)$/.exec(location.hash||'');
if(m)i=Math.min(Math.max(parseInt(m[1],10)-1,0),S.length-1);
render();
</script>
