<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNPAY Shop — Demo thanh toán</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">VN<span>PAY</span> Shop</div>
    <div class="tag">Sandbox — không mất tiền thật</div>
  </div>
</header>

<main>
  <h1>Chọn sản phẩm để thanh toán</h1>
  <p class="sub">Bấm mua → tạo đơn ở server → chuyển sang cổng VNPAY → quay về trang kết quả.</p>

  <div class="grid" id="products"></div>

  <div class="note">
    <strong>Thẻ test (ngân hàng NCB):</strong><br>
    Số thẻ <code>9704198526191432198</code> · Tên <code>NGUYEN VAN A</code> ·
    Ngày phát hành <code>07/15</code> · OTP <code>123456</code>
  </div>
</main>

<dialog id="checkout">
  <h2 style="margin:0 0 2px;font-size:19px;">Thanh toán</h2>
  <p class="sub" id="dlgProduct" style="margin:0"></p>

  <label for="amount">Số tiền (VND)</label>
  <input id="amount" type="number" min="5000" step="1000">

  <label for="orderInfo">Nội dung đơn hàng</label>
  <input id="orderInfo" maxlength="120">

  <label for="bankCode">Phương thức</label>
  <select id="bankCode">
    <option value="">Để VNPAY hiện trang chọn ngân hàng</option>
    <option value="NCB">NCB — dùng thẻ test ở trên</option>
    <option value="VNPAYQR">Quét mã VNPAYQR</option>
    <option value="VNBANK">Thẻ ATM nội địa</option>
    <option value="INTCARD">Thẻ quốc tế (Visa/Master)</option>
  </select>

  <div class="row">
    <button class="ghost" onclick="document.getElementById('checkout').close()">Huỷ</button>
    <button class="pay-btn" id="payBtn" onclick="pay()">Thanh toán</button>
  </div>
  <p id="err" style="color:#dc2626;font-size:13px;margin:10px 0 0;"></p>
</dialog>

<script>
const PRODUCTS = [
  { emoji: '☕', name: 'Cà phê sữa đá', price: 25000 },
  { emoji: '🎧', name: 'Tai nghe bluetooth', price: 350000 },
  { emoji: '📘', name: 'Sách Spring Boot', price: 189000 },
  { emoji: '🎟️', name: 'Vé xem phim', price: 90000 },
];

const vnd = n => n.toLocaleString('vi-VN') + '₫';

document.getElementById('products').innerHTML = PRODUCTS.map((p, i) => `
  <div class="card">
    <div class="emoji">${p.emoji}</div>
    <div class="name">${p.name}</div>
    <div class="price">${vnd(p.price)}</div>
    <button onclick="openCheckout(${i})">Mua ngay</button>
  </div>`).join('');

function openCheckout(i) {
  const p = PRODUCTS[i];
  document.getElementById('dlgProduct').textContent = p.emoji + ' ' + p.name;
  document.getElementById('amount').value = p.price;
  document.getElementById('orderInfo').value = 'Thanh toan ' + p.name;
  document.getElementById('err').textContent = '';
  document.getElementById('checkout').showModal();
}

async function pay() {
  const btn = document.getElementById('payBtn');
  const err = document.getElementById('err');
  btn.disabled = true;
  err.textContent = '';
  try {
    // Server ký HMAC-SHA512 rồi trả về URL — trình duyệt KHÔNG bao giờ giữ HashSecret.
    const res = await fetch('/api/payments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: Number(document.getElementById('amount').value),
        orderInfo: document.getElementById('orderInfo').value,
        bankCode: document.getElementById('bankCode').value
      })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    window.location.href = data.paymentUrl;
  } catch (e) {
    err.textContent = 'Lỗi: ' + e.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
