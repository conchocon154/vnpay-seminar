<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="eyebrow">Luồng</div>
  <h1>Bốn luồng, chỉ hai luồng được ghi status</h1>
  <div class="stack" style="margin-top:40px">
    <div class="tier"><div class="n">1</div><div class="lane">Web đến server</div><div class="txt"><span class="mono">POST /api/payments</span> tạo đơn, ký, trả URL</div></div>
    <div class="tier on"><div class="n">2</div><div class="lane">VNPAY đến server</div><div class="txt"><span class="mono">GET /vnpay/ipn</span> báo kết quả</div><div class="pill ok">Ghi status</div></div>
    <div class="tier"><div class="n">3</div><div class="lane">VNPAY đến web</div><div class="txt"><span class="mono">GET /vnpay/return</span> chỉ để hiển thị</div><div class="pill no">Không ghi</div></div>
    <div class="tier on"><div class="n">4</div><div class="lane">Server đến VNPAY</div><div class="txt"><span class="mono">querydr</span> hỏi lại khi IPN không về</div><div class="pill ok">Ghi status</div></div>
  </div>
</body></html>
